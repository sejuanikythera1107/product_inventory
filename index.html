<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>📦 Pocket Inventory · Sales tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1b7a4b;
      --primary-light: #e8f3ee;
      --primary-dark: #0e4d2e;
      --bg-gradient: linear-gradient(145deg, #f0f7f4 0%, #e6edf2 100%);
      --card-bg: #ffffff;
      --text-dark: #0f1e17;
      --text-muted: #5a6e64;
      --border: #dce5e0;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 25px rgba(0, 0, 0, 0.06);
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
      --stock-ok: #ffffff;
      --stock-low: #fef9c3;
      --stock-critical: #fee2e2;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font);
      background: var(--bg-gradient);
      min-height: 100vh;
      padding: 20px 12px 40px;
      display: flex;
      justify-content: center;
      color: var(--text-dark);
    }

    .app-container {
      max-width: 580px;
      width: 100%;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: var(--primary);
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 8px 18px rgba(27, 122, 75, 0.25);
    }

    .logo-text h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .logo-text span {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .header-date {
      background: white;
      padding: 8px 14px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px 18px;
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      transition: transform 0.15s ease;
    }

    .add-product-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-field {
      flex: 1;
      min-width: 130px;
    }

    .input-field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 1rem;
      background: #f9fbfc;
      transition: 0.2s;
      outline: none;
      font-family: var(--font);
      color: var(--text-dark);
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(27, 122, 75, 0.12);
    }

    .btn {
      border: none;
      font-weight: 600;
      padding: 13px 18px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      font-family: var(--font);
      letter-spacing: 0.2px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 6px 14px rgba(27, 122, 75, 0.25);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      box-shadow: 0 8px 18px rgba(27, 122, 75, 0.3);
    }

    .btn-light {
      background: #edf2f7;
      color: #1e293b;
    }
    .btn-light:hover {
      background: #e2e8f0;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }
    .btn-danger:hover {
      background: #fecaca;
    }

    .btn-outline {
      background: white;
      border: 1.5px solid var(--border);
      color: var(--text-dark);
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }

    #formMessage {
      font-size: 0.85rem;
      font-weight: 500;
      min-height: 20px;
      color: #b45309;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .product-item {
      background: var(--stock-ok);
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: transform 0.1s ease, box-shadow 0.2s, background 0.2s;
    }
    .product-item:hover {
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
    }
    .stock-low {
      background: var(--stock-low);
    }
    .stock-critical {
      background: var(--stock-critical);
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .product-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .category-badge {
      background: #ede9fe;
      color: #6d28d9;
    }

    .unit-badge {
      background: #fef3c7;
      color: #92400e;
    }

    .product-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .sold-section {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0 16px;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 50px;
      border: 1px solid #eef2f6;
    }

    .sold-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .sold-count {
      font-weight: 800;
      font-size: 1.8rem;
      color: var(--primary-dark);
      line-height: 1;
    }

    .stock-info {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .stock-badge {
      padding: 4px 10px;
      border-radius: 30px;
      background: #e2e8f0;
      color: var(--text-dark);
    }

    .customer-section {
      margin-top: 12px;
      border-top: 1px dashed #e0e7ef;
      padding-top: 16px;
    }

    .customer-section label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 10px;
    }

    .add-customer-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .add-customer-row input {
      flex: 1;
      min-width: 140px;
      padding: 11px 16px;
      border-radius: 50px;
    }

    .add-customer-row select {
      flex: 0 0 auto;
      width: auto;
      padding: 11px 14px;
      border-radius: 50px;
      background: white;
      font-weight: 600;
      color: var(--text-dark);
      border: 1.5px solid var(--border);
    }

    .customer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .customer-tag {
      background: #f1f5f9;
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e2e8f0;
      transition: 0.1s;
      flex-wrap: wrap;
      gap: 6px;
    }
    .customer-tag:hover {
      background: #e9eef3;
    }

    .customer-info {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      cursor: pointer;
      min-width: 0;
    }

    .customer-name {
      text-decoration: underline;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .customer-name-cash {
      color: #16a34a;
    }
    .customer-name-debt {
      color: #ea8c1e;
    }

    .customer-count-badge {
      background: #dbeafe;
      color: #1e40af;
      border-radius: 30px;
      padding: 2px 8px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .customer-date {
      font-size: 0.7rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .payment-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 30px;
      letter-spacing: 0.3px;
    }
    .payment-cash {
      background: #dcfce7;
      color: #166534;
    }
    .payment-debt {
      background: #ffedd5;
      color: #b45309;
    }

    .delete-customer {
      background: transparent;
      border: none;
      color: #b91c1c;
      font-weight: 700;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 6px;
      border-radius: 50%;
      line-height: 1;
    }
    .delete-customer:hover {
      background: #fee2e2;
    }

    .empty-message {
      text-align: center;
      color: #94a3b8;
      padding: 40px 20px;
      font-style: italic;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .edit-input {
      background: #fefce8 !important;
      border-color: #f59e0b !important;
    }

    .hidden {
      display: none !important;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
      backdrop-filter: blur(3px);
    }

    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      animation: modalFadeIn 0.2s ease;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .modal-close {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
    }

    .summary-stats {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-box {
      flex: 1;
      background: #f8fafc;
      padding: 12px;
      border-radius: 16px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .summary-list {
      max-height: 250px;
      overflow-y: auto;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
      font-size: 0.85rem;
      gap: 10px;
      flex-wrap: wrap;
    }
    .summary-item-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .summary-item-date {
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    .modal-hidden {
      display: none !important;
    }

    @media (max-width: 400px) {
      .sold-section {
        flex-direction: column;
        align-items: flex-start;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="app-header">
      <div class="logo-area">
        <div class="logo-icon">📦</div>
        <div class="logo-text">
          <h1>Pocket Inventory</h1>
          <span>daily sales tracker</span>
        </div>
      </div>
      <div class="header-date" id="currentDate"></div>
    </div>

    <div class="card">
      <div class="add-product-form">
        <div class="input-row">
          <div class="input-field">
            <label>Product name</label>
            <input type="text" id="productNameInput" placeholder="e.g. Iced Coffee" autocomplete="off">
          </div>
          <div class="input-field">
            <label>Price (₱/$)</label>
            <input type="number" id="productPriceInput" placeholder="0.00" min="0" step="0.01">
          </div>
        </div>
        <div class="input-row">
          <div class="input-field">
            <label>Category</label>
            <select id="productCategoryInput">
              <option value="other">Other</option>
              <option value="cigarettes">Cigarettes</option>
              <option value="liquor">Liquor</option>
              <option value="soft drinks">Soft Drinks</option>
              <option value="juice">Juice</option>
              <option value="ice">Ice</option>
            </select>
          </div>
          <div class="input-field hidden" id="cigaretteUnitField">
            <label>Cigarette unit</label>
            <select id="cigaretteUnitInput">
              <option value="stick">Per Stick</option>
              <option value="box">Per Box</option>
            </select>
          </div>
        </div>
        <div class="input-row">
          <div class="input-field">
            <label>Total stock</label>
            <input type="number" id="totalStockInput" placeholder="e.g. 50" min="0" step="1">
          </div>
          <div class="input-field">
            <label>Stock left</label>
            <input type="number" id="stockLeftInput" placeholder="e.g. 20" min="0" step="1">
          </div>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-primary" id="addProductBtn">➕ Add product</button>
          <button class="btn btn-light" id="clearFormBtn">Clear</button>
        </div>
        <div id="formMessage"></div>
      </div>
    </div>

    <div id="productListContainer" class="product-list"></div>
  </div>

  <!-- Customer summary modal -->
  <div id="customerModal" class="modal-overlay modal-hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">👤 Customer Summary</span>
        <button class="modal-close" id="modalCloseBtn">✕</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    (function() {
      const STORAGE_KEY = 'pocket_inventory_products_v8'; // updated key for date support

      const defaultProducts = [
        {
          id: 'prod_' + Date.now() + '_1',
          name: 'Mango Graham Shake',
          price: 120,
          category: 'juice',
          cigaretteUnit: null,
          totalStock: 50,
          stockLeft: 20,
          customers: [
            { name: 'Ana', paymentType: 'cash', date: new Date().toISOString() },
            { name: 'Marco', paymentType: 'cash', date: new Date().toISOString() },
            { name: 'Juls', paymentType: 'debt', date: new Date().toISOString() }
          ]
        },
        {
          id: 'prod_' + Date.now() + '_2',
          name: 'Marlboro Red',
          price: 150,
          category: 'cigarettes',
          cigaretteUnit: 'stick',
          totalStock: 100,
          stockLeft: 3,
          customers: [
            { name: 'Tita Linda', paymentType: 'cash', date: new Date().toISOString() }
          ]
        }
      ];

      let products = [];

      function loadProducts() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            products = JSON.parse(stored);
            products = products.map(p => ({
              ...p,
              category: p.category || 'other',
              cigaretteUnit: p.cigaretteUnit || null,
              totalStock: p.totalStock || 0,
              stockLeft: p.stockLeft || 0,
              customers: Array.isArray(p.customers) ? p.customers.map(c => {
                if (typeof c === 'string') {
                  return { name: c, paymentType: 'cash', date: new Date().toISOString() };
                }
                return {
                  ...c,
                  date: c.date || new Date().toISOString()
                };
              }) : []
            }));
          } catch (e) {
            products = [...defaultProducts];
          }
        } else {
          products = [...defaultProducts];
        }
        saveProducts();
      }

      function saveProducts() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
      }

      // DOM elements
      const productNameInput = document.getElementById('productNameInput');
      const productPriceInput = document.getElementById('productPriceInput');
      const productCategoryInput = document.getElementById('productCategoryInput');
      const cigaretteUnitField = document.getElementById('cigaretteUnitField');
      const cigaretteUnitInput = document.getElementById('cigaretteUnitInput');
      const totalStockInput = document.getElementById('totalStockInput');
      const stockLeftInput = document.getElementById('stockLeftInput');
      const addProductBtn = document.getElementById('addProductBtn');
      const clearFormBtn = document.getElementById('clearFormBtn');
      const productListContainer = document.getElementById('productListContainer');
      const formMessage = document.getElementById('formMessage');
      const currentDateEl = document.getElementById('currentDate');
      const customerModal = document.getElementById('customerModal');
      const modalBody = document.getElementById('modalBody');
      const modalCloseBtn = document.getElementById('modalCloseBtn');

      let editingProductId = null;

      const today = new Date();
      currentDateEl.textContent = today.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

      function toggleCigaretteUnit() {
        if (productCategoryInput.value === 'cigarettes') {
          cigaretteUnitField.classList.remove('hidden');
        } else {
          cigaretteUnitField.classList.add('hidden');
          cigaretteUnitInput.value = 'stick';
        }
      }
      productCategoryInput.addEventListener('change', toggleCigaretteUnit);
      toggleCigaretteUnit();

      // Build a map of customer name -> total purchase count
      function buildCustomerCountMap() {
        const countMap = {};
        products.forEach(prod => {
          prod.customers.forEach(c => {
            const name = c.name;
            countMap[name] = (countMap[name] || 0) + 1;
          });
        });
        return countMap;
      }

      function getStockStatus(product) {
        if (!product.totalStock || product.totalStock <= 0) return 'ok';
        if (product.stockLeft <= 3) return 'critical';
        if (product.stockLeft <= product.totalStock / 2) return 'low';
        return 'ok';
      }

      function formatDate(isoString) {
        if (!isoString) return 'No date';
        try {
          const date = new Date(isoString);
          return date.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        } catch {
          return 'Invalid date';
        }
      }

      function renderProductList() {
        if (!productListContainer) return;
        if (products.length === 0) {
          productListContainer.innerHTML = `<div class="empty-message">✨ No products yet. Add your first item above.</div>`;
          return;
        }

        const customerCountMap = buildCustomerCountMap();

        let html = '';
        products.forEach(product => {
          const customers = product.customers || [];
          const soldCount = customers.length;
          const stockStatus = getStockStatus(product);
          const stockClass = stockStatus === 'critical' ? 'stock-critical' : stockStatus === 'low' ? 'stock-low' : '';

          const customerTags = customers.map((cust, idx) => {
            const name = cust.name || 'Unknown';
            const paymentType = cust.paymentType || 'cash';
            const nameColorClass = paymentType === 'cash' ? 'customer-name-cash' : 'customer-name-debt';
            const badgeClass = paymentType === 'cash' ? 'payment-cash' : 'payment-debt';
            const totalPurchases = customerCountMap[name] || 1;
            const dateFormatted = formatDate(cust.date);

            return `
              <div class="customer-tag">
                <div class="customer-info" data-customer-index="${idx}" data-product-id="${product.id}">
                  <span class="customer-name ${nameColorClass}">👤 ${escapeHTML(name)}</span>
                  <span class="customer-count-badge">${totalPurchases} purchase${totalPurchases > 1 ? 's' : ''}</span>
                  <span class="customer-date">${dateFormatted}</span>
                  <span class="payment-badge ${badgeClass}">${paymentType === 'cash' ? 'Cash' : 'Debt'}</span>
                </div>
                <button class="delete-customer" data-product-id="${product.id}" data-customer-index="${idx}">✕</button>
              </div>
            `;
          }).join('');

          let stockInfo = '';
          if (product.totalStock > 0) {
            stockInfo = `
              <div class="stock-info">
                <span class="stock-badge">📦 Stock: ${product.stockLeft} / ${product.totalStock}</span>
                ${stockStatus === 'critical' ? '<span style="color:red; font-weight:700;">⚠️ Critical</span>' : ''}
                ${stockStatus === 'low' ? '<span style="color:orange; font-weight:700;">🟡 Halfway</span>' : ''}
              </div>
            `;
          }

          html += `
            <div class="product-item ${stockClass}" data-product-id="${product.id}">
              <div class="product-header">
                <div class="product-title">
                  ${escapeHTML(product.name)}
                  <span class="badge">₱${parseFloat(product.price).toFixed(2)}</span>
                  <span class="badge category-badge">${escapeHTML(product.category)}</span>
                  ${product.cigaretteUnit ? `<span class="badge unit-badge">${product.cigaretteUnit === 'stick' ? 'Per Stick' : 'Per Box'}</span>` : ''}
                </div>
                <div class="product-actions">
                  <button class="btn btn-outline edit-product-btn" data-id="${product.id}" style="padding:8px 12px;">✏️</button>
                  <button class="btn btn-danger delete-product-btn" data-id="${product.id}" style="padding:8px 12px;">🗑️</button>
                </div>
              </div>

              <div class="sold-section">
                <span class="sold-label">📊 Sold today</span>
                <span class="sold-count">${soldCount}</span>
              </div>
              ${stockInfo}

              <div class="customer-section">
                <label>👥 Customers (${customers.length})</label>
                <div class="add-customer-row">
                  <input type="text" class="customer-name-input" data-product-id="${product.id}" placeholder="Customer name" autocomplete="off">
                  <select class="customer-payment-select" data-product-id="${product.id}">
                    <option value="cash" selected>💵 Cash</option>
                    <option value="debt">📒 Debt</option>
                  </select>
                  <button class="btn btn-light add-customer-btn" data-id="${product.id}" style="padding:11px 16px; border-radius:50px;">+ Add</button>
                </div>
                <div class="customer-list">
                  ${customerTags || '<div style="color:#94a3b8; font-size:0.85rem;">No customers yet</div>'}
                </div>
              </div>
            </div>
          `;
        });

        productListContainer.innerHTML = html;
      }

      function escapeHTML(text) {
        if (!text) return '';
        return String(text).replace(/[&<>"]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      function handleAddOrUpdate() {
        const name = productNameInput.value.trim();
        const price = parseFloat(productPriceInput.value);
        const category = productCategoryInput.value;
        const cigaretteUnit = category === 'cigarettes' ? cigaretteUnitInput.value : null;
        const totalStock = parseInt(totalStockInput.value) || 0;
        const stockLeft = parseInt(stockLeftInput.value) || 0;

        if (!name) {
          formMessage.textContent = '❗ Please enter a product name.';
          return;
        }
        if (isNaN(price) || price < 0) {
          formMessage.textContent = '❗ Price must be a valid positive number.';
          return;
        }

        if (editingProductId) {
          const index = products.findIndex(p => p.id === editingProductId);
          if (index !== -1) {
            products[index] = { ...products[index], name, price, category, cigaretteUnit, totalStock, stockLeft };
            formMessage.textContent = '✅ Product updated.';
          }
          editingProductId = null;
          addProductBtn.innerHTML = '➕ Add product';
        } else {
          const newProduct = {
            id: 'prod_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
            name,
            price,
            category,
            cigaretteUnit,
            totalStock,
            stockLeft,
            customers: []
          };
          products.push(newProduct);
          formMessage.textContent = '✅ Product added successfully.';
        }
        saveProducts();
        clearForm();
        renderProductList();
      }

      function clearForm() {
        productNameInput.value = '';
        productPriceInput.value = '';
        productCategoryInput.value = 'other';
        cigaretteUnitInput.value = 'stick';
        totalStockInput.value = '';
        stockLeftInput.value = '';
        editingProductId = null;
        addProductBtn.innerHTML = '➕ Add product';
        formMessage.textContent = '';
        productNameInput.classList.remove('edit-input');
        productPriceInput.classList.remove('edit-input');
        toggleCigaretteUnit();
      }

      function showCustomerSummary(productId, customerIndex) {
        const product = products.find(p => p.id === productId);
        if (!product) return;
        const customer = product.customers[customerIndex];
        if (!customer) return;

        const customerName = customer.name;
        let totalCash = 0, totalDebt = 0, totalItems = 0;
        let summaryItems = [];

        products.forEach(prod => {
          prod.customers.forEach((c, idx) => {
            if (c.name === customerName) {
              totalItems++;
              if (c.paymentType === 'cash') totalCash += parseFloat(prod.price) || 0;
              else totalDebt += parseFloat(prod.price) || 0;
              summaryItems.push({
                productName: prod.name,
                price: prod.price,
                paymentType: c.paymentType,
                unit: prod.cigaretteUnit || null,
                date: c.date
              });
            }
          });
        });

        let listHtml = summaryItems.length === 0 ? '<div>No purchases found.</div>' :
          summaryItems.map(item => `
            <div class="summary-item">
              <div class="summary-item-left">
                <span><strong>${escapeHTML(item.productName)}</strong> ${item.unit ? '(' + (item.unit === 'stick' ? 'Per Stick' : 'Per Box') + ')' : ''} (₱${parseFloat(item.price).toFixed(2)})</span>
                <span class="summary-item-date">📅 ${formatDate(item.date)}</span>
              </div>
              <span class="payment-badge ${item.paymentType === 'cash' ? 'payment-cash' : 'payment-debt'}">${item.paymentType === 'cash' ? 'Cash' : 'Debt'}</span>
            </div>
          `).join('');

        modalBody.innerHTML = `
          <div class="summary-stats">
            <div class="stat-box">
              <div class="stat-value">${totalItems}</div>
              <div class="stat-label">Items</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">₱${totalCash.toFixed(2)}</div>
              <div class="stat-label">Cash</div>
            </div>
            <div class="stat-box">
              <div class="stat-value">₱${totalDebt.toFixed(2)}</div>
              <div class="stat-label">Debt</div>
            </div>
          </div>
          <div class="summary-list">${listHtml}</div>
        `;

        customerModal.classList.remove('modal-hidden');
      }

      function closeModal() {
        customerModal.classList.add('modal-hidden');
      }

      modalCloseBtn.addEventListener('click', closeModal);
      customerModal.addEventListener('click', function(e) {
        if (e.target === customerModal) closeModal();
      });

      productListContainer.addEventListener('click', function(e) {
        const customerInfo = e.target.closest('.customer-info');
        if (customerInfo) {
          const productId = customerInfo.getAttribute('data-product-id');
          const customerIndex = parseInt(customerInfo.getAttribute('data-customer-index'), 10);
          if (productId && !isNaN(customerIndex)) {
            showCustomerSummary(productId, customerIndex);
            return;
          }
        }

        const target = e.target.closest('button');
        if (!target) return;

        if (target.classList.contains('delete-product-btn')) {
          const productId = target.getAttribute('data-id');
          if (productId && confirm('Delete this product?')) {
            products = products.filter(p => p.id !== productId);
            saveProducts();
            renderProductList();
            if (editingProductId === productId) clearForm();
          }
          return;
        }

        if (target.classList.contains('edit-product-btn')) {
          const productId = target.getAttribute('data-id');
          const product = products.find(p => p.id === productId);
          if (product) {
            productNameInput.value = product.name;
            productPriceInput.value = product.price;
            productCategoryInput.value = product.category || 'other';
            if (product.category === 'cigarettes' && product.cigaretteUnit) {
              cigaretteUnitInput.value = product.cigaretteUnit;
            } else {
              cigaretteUnitInput.value = 'stick';
            }
            totalStockInput.value = product.totalStock || '';
            stockLeftInput.value = product.stockLeft || '';
            toggleCigaretteUnit();
            editingProductId = productId;
            addProductBtn.innerHTML = '💾 Update product';
            formMessage.textContent = `✏️ Editing "${product.name}" — modify and save.`;
            productNameInput.classList.add('edit-input');
            productPriceInput.classList.add('edit-input');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
          return;
        }

        if (target.classList.contains('add-customer-btn')) {
          const productId = target.getAttribute('data-id');
          const inputField = document.querySelector(`.customer-name-input[data-product-id="${productId}"]`);
          const selectField = document.querySelector(`.customer-payment-select[data-product-id="${productId}"]`);
          const customerName = inputField ? inputField.value.trim() : '';
          const paymentType = selectField ? selectField.value : 'cash';
          if (!customerName) { alert('Please enter a customer name.'); return; }
          const product = products.find(p => p.id === productId);
          if (product) {
            product.customers.push({ 
              name: customerName, 
              paymentType, 
              date: new Date().toISOString() 
            });
            saveProducts();
            renderProductList();
          }
          return;
        }

        if (target.classList.contains('delete-customer')) {
          const productId = target.getAttribute('data-product-id');
          const customerIndex = target.getAttribute('data-customer-index');
          if (productId && customerIndex !== null) {
            const idx = parseInt(customerIndex, 10);
            const product = products.find(p => p.id === productId);
            if (product && idx >= 0 && idx < product.customers.length) {
              product.customers.splice(idx, 1);
              saveProducts();
              renderProductList();
            }
          }
          return;
        }
      });

      productListContainer.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.classList.contains('customer-name-input')) {
          const productId = e.target.getAttribute('data-product-id');
          const inputField = e.target;
          const selectField = document.querySelector(`.customer-payment-select[data-product-id="${productId}"]`);
          const customerName = inputField.value.trim();
          const paymentType = selectField ? selectField.value : 'cash';
          if (customerName && productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
              product.customers.push({ 
                name: customerName, 
                paymentType, 
                date: new Date().toISOString() 
              });
              saveProducts();
              renderProductList();
            }
          }
        }
      });

      addProductBtn.addEventListener('click', handleAddOrUpdate);
      clearFormBtn.addEventListener('click', clearForm);
      productNameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAddOrUpdate(); });
      productPriceInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAddOrUpdate(); });

      loadProducts();
      renderProductList();
    })();
  </script>
</body>
</html>
