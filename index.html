<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>📦 Pocket Inventory · Sales tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1b7a4b;
      --primary-light: #e8f3ee;
      --primary-dark: #0e4d2e;
      --bg-gradient: linear-gradient(145deg, #f0f7f4 0%, #e6edf2 100%);
      --card-bg: #ffffff;
      --text-dark: #0f1e17;
      --text-muted: #5a6e64;
      --border: #dce5e0;
      --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 25px rgba(0, 0, 0, 0.06);
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font);
      background: var(--bg-gradient);
      min-height: 100vh;
      padding: 20px 12px 40px;
      display: flex;
      justify-content: center;
      color: var(--text-dark);
    }

    .app-container {
      max-width: 580px;
      width: 100%;
    }

    /* header */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      background: var(--primary);
      width: 48px;
      height: 48px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      box-shadow: 0 8px 18px rgba(27, 122, 75, 0.25);
    }

    .logo-text h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.2;
    }

    .logo-text span {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.4px;
      text-transform: uppercase;
    }

    .header-date {
      background: white;
      padding: 8px 14px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--primary);
      box-shadow: var(--shadow-sm);
      white-space: nowrap;
    }

    /* card */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 20px 18px;
      box-shadow: var(--shadow-md);
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(2px);
      transition: transform 0.15s ease;
    }

    /* form */
    .add-product-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-field {
      flex: 1;
      min-width: 130px;
    }

    .input-field label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 1rem;
      background: #f9fbfc;
      transition: 0.2s;
      outline: none;
      font-family: var(--font);
      color: var(--text-dark);
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(27, 122, 75, 0.12);
    }

    .btn {
      border: none;
      font-weight: 600;
      padding: 13px 18px;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      font-family: var(--font);
      letter-spacing: 0.2px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 6px 14px rgba(27, 122, 75, 0.25);
    }
    .btn-primary:hover {
      background: var(--primary-dark);
      box-shadow: 0 8px 18px rgba(27, 122, 75, 0.3);
    }

    .btn-light {
      background: #edf2f7;
      color: #1e293b;
    }
    .btn-light:hover {
      background: #e2e8f0;
    }

    .btn-danger {
      background: #fee2e2;
      color: #b91c1c;
    }
    .btn-danger:hover {
      background: #fecaca;
    }

    .btn-outline {
      background: white;
      border: 1.5px solid var(--border);
      color: var(--text-dark);
    }
    .btn-outline:hover {
      background: #f1f5f9;
    }

    #formMessage {
      font-size: 0.85rem;
      font-weight: 500;
      min-height: 20px;
      color: #b45309;
    }

    /* product list */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .product-item {
      background: white;
      border-radius: var(--radius-lg);
      padding: 18px 16px;
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(255, 255, 255, 0.7);
      transition: transform 0.1s ease, box-shadow 0.2s;
    }
    .product-item:hover {
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    .product-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      background: var(--primary-light);
      color: var(--primary);
      padding: 5px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .product-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .counter-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 14px 0 16px;
      flex-wrap: wrap;
      background: #f8fafc;
      padding: 10px 14px;
      border-radius: 50px;
      border: 1px solid #eef2f6;
    }

    .counter-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .counter-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .counter-btn {
      background: white;
      border: 1.5px solid #d1d9e0;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }
    .counter-btn:active {
      background: var(--primary-light);
      border-color: var(--primary);
      transform: scale(0.9);
    }

    .sold-count {
      font-weight: 800;
      font-size: 1.8rem;
      color: var(--primary-dark);
      min-width: 45px;
      text-align: center;
      line-height: 1;
    }

    .reset-daily {
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fed7aa;
      padding: 8px 16px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .reset-daily:hover {
      background: #ffedd5;
    }

    .customer-section {
      margin-top: 12px;
      border-top: 1px dashed #e0e7ef;
      padding-top: 16px;
    }

    .customer-section label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: block;
      margin-bottom: 10px;
    }

    .add-customer-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .add-customer-row input {
      flex: 1;
      min-width: 140px;
      padding: 11px 16px;
      border-radius: 50px;
    }

    .add-customer-row select {
      flex: 0 0 auto;
      width: auto;
      padding: 11px 14px;
      border-radius: 50px;
      background: white;
      font-weight: 600;
      color: var(--text-dark);
      border: 1.5px solid var(--border);
    }

    .customer-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 140px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .customer-tag {
      background: #f1f5f9;
      border-radius: 30px;
      padding: 9px 16px;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #e2e8f0;
      transition: 0.1s;
      flex-wrap: wrap;
      gap: 6px;
    }
    .customer-tag:hover {
      background: #e9eef3;
    }

    .customer-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .payment-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 30px;
      letter-spacing: 0.3px;
    }
    .payment-cash {
      background: #dcfce7;
      color: #166534;
    }
    .payment-debt {
      background: #fee2e2;
      color: #b91c1c;
    }

    .delete-customer {
      background: transparent;
      border: none;
      color: #b91c1c;
      font-weight: 700;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 6px;
      border-radius: 50%;
      line-height: 1;
    }
    .delete-customer:hover {
      background: #fee2e2;
    }

    .empty-message {
      text-align: center;
      color: #94a3b8;
      padding: 40px 20px;
      font-style: italic;
      background: white;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
    }

    .edit-input {
      background: #fefce8 !important;
      border-color: #f59e0b !important;
    }

    @media (max-width: 400px) {
      .counter-section {
        flex-direction: column;
        align-items: stretch;
        border-radius: 20px;
      }
      .counter-control {
        justify-content: center;
      }
      .reset-daily {
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- header -->
    <div class="app-header">
      <div class="logo-area">
        <div class="logo-icon">📦</div>
        <div class="logo-text">
          <h1>Pocket Inventory</h1>
          <span>daily sales tracker</span>
        </div>
      </div>
      <div class="header-date" id="currentDate"></div>
    </div>

    <!-- add / edit product form -->
    <div class="card">
      <div class="add-product-form">
        <div class="input-row">
          <div class="input-field">
            <label>Product name</label>
            <input type="text" id="productNameInput" placeholder="e.g. Iced Coffee" autocomplete="off">
          </div>
          <div class="input-field">
            <label>Price (₱/$)</label>
            <input type="number" id="productPriceInput" placeholder="0.00" min="0" step="0.01">
          </div>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-primary" id="addProductBtn">➕ Add product</button>
          <button class="btn btn-light" id="clearFormBtn">Clear</button>
        </div>
        <div id="formMessage"></div>
      </div>
    </div>

    <!-- product list -->
    <div id="productListContainer" class="product-list">
      <!-- dynamic -->
    </div>
  </div>

  <script>
    (function() {
      // ---------- storage ----------
      const STORAGE_KEY = 'pocket_inventory_products_v2'; // new version key to avoid conflicts

      const defaultProducts = [
        {
          id: 'prod_' + Date.now() + '_1',
          name: 'Mango Graham Shake',
          price: 120,
          soldToday: 7,
          customers: [
            { name: 'Ana', paymentType: 'cash' },
            { name: 'Marco', paymentType: 'cash' },
            { name: 'Juls', paymentType: 'debt' }
          ]
        },
        {
          id: 'prod_' + Date.now() + '_2',
          name: 'Cheese Pandesal (6pc)',
          price: 90,
          soldToday: 3,
          customers: [
            { name: 'Tita Linda', paymentType: 'cash' }
          ]
        }
      ];

      let products = [];

      function loadProducts() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            products = JSON.parse(stored);
            // migrate any old format where customers were strings
            products = products.map(p => ({
              ...p,
              customers: Array.isArray(p.customers) ? p.customers.map(c => {
                if (typeof c === 'string') {
                  return { name: c, paymentType: 'cash' }; // default to cash for legacy entries
                }
                return c;
              }) : []
            }));
          } catch (e) {
            products = [...defaultProducts];
          }
        } else {
          products = [...defaultProducts];
        }
        saveProducts();
      }

      function saveProducts() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
      }

      // ---------- DOM ----------
      const productNameInput = document.getElementById('productNameInput');
      const productPriceInput = document.getElementById('productPriceInput');
      const addProductBtn = document.getElementById('addProductBtn');
      const clearFormBtn = document.getElementById('clearFormBtn');
      const productListContainer = document.getElementById('productListContainer');
      const formMessage = document.getElementById('formMessage');
      const currentDateEl = document.getElementById('currentDate');

      let editingProductId = null;

      const today = new Date();
      currentDateEl.textContent = today.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });

      function renderProductList() {
        if (!productListContainer) return;
        if (products.length === 0) {
          productListContainer.innerHTML = `<div class="empty-message">✨ No products yet. Add your first item above.</div>`;
          return;
        }

        let html = '';
        products.forEach(product => {
          const customers = product.customers || [];
          const customerTags = customers.map((cust, idx) => {
            const name = cust.name || 'Unknown';
            const paymentType = cust.paymentType || 'cash';
            const badgeClass = paymentType === 'cash' ? 'payment-cash' : 'payment-debt';
            return `
              <div class="customer-tag">
                <div class="customer-info">
                  <span>👤 ${escapeHTML(name)}</span>
                  <span class="payment-badge ${badgeClass}">${paymentType === 'cash' ? 'Cash' : 'Debt'}</span>
                </div>
                <button class="delete-customer" data-product-id="${product.id}" data-customer-index="${idx}" title="Remove customer">✕</button>
              </div>
            `;
          }).join('');

          html += `
            <div class="product-item" data-product-id="${product.id}">
              <div class="product-header">
                <div class="product-title">
                  ${escapeHTML(product.name)}
                  <span class="badge">₱${parseFloat(product.price).toFixed(2)}</span>
                </div>
                <div class="product-actions">
                  <button class="btn btn-outline edit-product-btn" data-id="${product.id}" style="padding:8px 12px;">✏️</button>
                  <button class="btn btn-danger delete-product-btn" data-id="${product.id}" style="padding:8px 12px;">🗑️</button>
                </div>
              </div>

              <div class="counter-section">
                <span class="counter-label">📊 Sold today</span>
                <div class="counter-control">
                  <button class="counter-btn dec-sold-btn" data-id="${product.id}">−</button>
                  <span class="sold-count" id="sold-count-${product.id}">${product.soldToday}</span>
                  <button class="counter-btn inc-sold-btn" data-id="${product.id}">+</button>
                </div>
                <button class="reset-daily reset-sold-btn" data-id="${product.id}">↺ Reset day</button>
              </div>

              <div class="customer-section">
                <label>👥 Customers (${customers.length})</label>
                <div class="add-customer-row">
                  <input type="text" class="customer-name-input" data-product-id="${product.id}" placeholder="Customer name" autocomplete="off">
                  <select class="customer-payment-select" data-product-id="${product.id}">
                    <option value="cash" selected>💵 Cash</option>
                    <option value="debt">📒 Debt</option>
                  </select>
                  <button class="btn btn-light add-customer-btn" data-id="${product.id}" style="padding:11px 16px; border-radius:50px;">+ Add</button>
                </div>
                <div class="customer-list">
                  ${customerTags || '<div style="color:#94a3b8; font-size:0.85rem;">No customers yet</div>'}
                </div>
              </div>
            </div>
          `;
        });

        productListContainer.innerHTML = html;
      }

      function escapeHTML(text) {
        if (!text) return '';
        return String(text).replace(/[&<>"]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      function handleAddOrUpdate() {
        const name = productNameInput.value.trim();
        const price = parseFloat(productPriceInput.value);

        if (!name) {
          formMessage.textContent = '❗ Please enter a product name.';
          return;
        }
        if (isNaN(price) || price < 0) {
          formMessage.textContent = '❗ Price must be a valid positive number.';
          return;
        }

        if (editingProductId) {
          const index = products.findIndex(p => p.id === editingProductId);
          if (index !== -1) {
            products[index] = { ...products[index], name, price };
            formMessage.textContent = '✅ Product updated.';
          }
          editingProductId = null;
          addProductBtn.innerHTML = '➕ Add product';
        } else {
          const newProduct = {
            id: 'prod_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8),
            name,
            price,
            soldToday: 0,
            customers: []
          };
          products.push(newProduct);
          formMessage.textContent = '✅ Product added successfully.';
        }
        saveProducts();
        clearForm();
        renderProductList();
      }

      function clearForm() {
        productNameInput.value = '';
        productPriceInput.value = '';
        editingProductId = null;
        addProductBtn.innerHTML = '➕ Add product';
        formMessage.textContent = '';
        productNameInput.classList.remove('edit-input');
        productPriceInput.classList.remove('edit-input');
      }

      // ---------- event delegation ----------
      productListContainer.addEventListener('click', function(e) {
        const target = e.target.closest('button');
        if (!target) return;

        if (target.classList.contains('delete-product-btn')) {
          const productId = target.getAttribute('data-id');
          if (productId && confirm('Delete this product?')) {
            products = products.filter(p => p.id !== productId);
            saveProducts();
            renderProductList();
            if (editingProductId === productId) clearForm();
          }
          return;
        }

        if (target.classList.contains('edit-product-btn')) {
          const productId = target.getAttribute('data-id');
          const product = products.find(p => p.id === productId);
          if (product) {
            productNameInput.value = product.name;
            productPriceInput.value = product.price;
            editingProductId = productId;
            addProductBtn.innerHTML = '💾 Update product';
            formMessage.textContent = `✏️ Editing "${product.name}" — modify and save.`;
            productNameInput.classList.add('edit-input');
            productPriceInput.classList.add('edit-input');
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
          return;
        }

        if (target.classList.contains('inc-sold-btn')) {
          const productId = target.getAttribute('data-id');
          const product = products.find(p => p.id === productId);
          if (product) { product.soldToday += 1; saveProducts(); renderProductList(); }
          return;
        }

        if (target.classList.contains('dec-sold-btn')) {
          const productId = target.getAttribute('data-id');
          const product = products.find(p => p.id === productId);
          if (product && product.soldToday > 0) { product.soldToday -= 1; saveProducts(); renderProductList(); }
          return;
        }

        if (target.classList.contains('reset-sold-btn')) {
          const productId = target.getAttribute('data-id');
          const product = products.find(p => p.id === productId);
          if (product) { product.soldToday = 0; saveProducts(); renderProductList(); }
          return;
        }

        if (target.classList.contains('add-customer-btn')) {
          const productId = target.getAttribute('data-id');
          const inputField = document.querySelector(`.customer-name-input[data-product-id="${productId}"]`);
          const selectField = document.querySelector(`.customer-payment-select[data-product-id="${productId}"]`);
          const customerName = inputField ? inputField.value.trim() : '';
          const paymentType = selectField ? selectField.value : 'cash';
          if (!customerName) { alert('Please enter a customer name.'); return; }
          const product = products.find(p => p.id === productId);
          if (product) {
            product.customers.push({ name: customerName, paymentType: paymentType });
            saveProducts();
            renderProductList();
          }
          return;
        }

        if (target.classList.contains('delete-customer')) {
          const productId = target.getAttribute('data-product-id');
          const customerIndex = target.getAttribute('data-customer-index');
          if (productId && customerIndex !== null) {
            const idx = parseInt(customerIndex, 10);
            const product = products.find(p => p.id === productId);
            if (product && idx >= 0 && idx < product.customers.length) {
              product.customers.splice(idx, 1);
              saveProducts();
              renderProductList();
            }
          }
          return;
        }
      });

      productListContainer.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.classList.contains('customer-name-input')) {
          const productId = e.target.getAttribute('data-product-id');
          const inputField = e.target;
          const selectField = document.querySelector(`.customer-payment-select[data-product-id="${productId}"]`);
          const customerName = inputField.value.trim();
          const paymentType = selectField ? selectField.value : 'cash';
          if (customerName && productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
              product.customers.push({ name: customerName, paymentType: paymentType });
              saveProducts();
              renderProductList();
            }
          }
        }
      });

      addProductBtn.addEventListener('click', handleAddOrUpdate);
      clearFormBtn.addEventListener('click', clearForm);
      productNameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAddOrUpdate(); });
      productPriceInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleAddOrUpdate(); });

      // init
      loadProducts();
      renderProductList();
    })();
  </script>
</body>
</html>
